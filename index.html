<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>حياتي — منظّم يومي</title>
<meta name="theme-color" content="#2BA89A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="حياتي">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232BA89A'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='Arial'>ح</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>:root{
  --bg:#F5F8F4; --card:#FFFFFF; --ink:#24333A; --muted:#71818A; --line:#E6ECE8;
  --p:#2BA89A; --p-soft:#E2F5F2; --p2:#4FA3DD;
  --teal:#2BA89A; --teal-soft:#E2F5F2; --coral:#FF8A65; --coral-soft:#FFEDE6;
  --sun:#F2A900; --sun-soft:#FFF6DF; --lav:#8E7CC3; --lav-soft:#EFEBF8;
  --sky:#4FA3DD; --sky-soft:#E5F2FB; --green:#4CAF50; --green-soft:#E7F5E7;
  --rose:#E36588; --rose-soft:#FCE8EE;
  --radius:18px; --shadow:0 4px 18px rgba(36,51,58,.06);
}
[data-theme=sky]{--bg:#F3F7FC;--p:#3D8BD9;--p-soft:#E3EFFB;--p2:#7B6CD9}
[data-theme=peach]{--bg:#FFF8F3;--p:#F07A4F;--p-soft:#FFEADF;--p2:#F2A900}
[data-theme=lavender]{--bg:#F7F5FC;--p:#7E6BC4;--p-soft:#EEE9FA;--p2:#E36588}
[data-theme=sand]{--bg:#FAF7F0;--p:#C4892B;--p-soft:#F7EDD9;--p2:#2BA89A}
[data-theme=forest]{--bg:#F3F7F2;--p:#3E9B5B;--p-soft:#E2F2E6;--p2:#2BA89A}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;transition:background .4s}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{cursor:default}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--card);border-left:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 14px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.brand b{font-size:19px}
.brand small{display:block;color:var(--muted);font-size:12px}
#navs{display:contents}
.navg{font-size:11px;font-weight:800;color:#A5B1B7;padding:12px 14px 4px;letter-spacing:.3px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:11px;color:var(--muted);font-weight:500;text-align:right;width:100%;transition:.15s;font-size:14px}
.nav:hover{background:var(--bg);color:var(--ink)}
.nav.on{background:var(--p-soft);color:var(--p);font-weight:700}
.nav .ic{font-size:17px;width:22px;text-align:center}
.nav .cnt{margin-right:auto;background:var(--rose);color:#fff;font-size:11px;border-radius:99px;padding:1px 7px;font-weight:700}
.side .foot{margin-top:14px;padding:12px;border-radius:14px;background:var(--sun-soft);font-size:13px;line-height:1.7}
/* main */
.main{padding:20px 28px 80px;max-width:1300px;width:100%}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:23px;font-weight:800}
.top .sub{color:var(--muted);font-size:14px;margin-top:3px}
.top .grow{flex:1}
.pill{display:flex;align-items:center;gap:8px;background:var(--card);padding:8px 13px;border-radius:999px;box-shadow:var(--shadow);font-weight:700;font-size:14px}
button.pill:hover{background:var(--p-soft)}
.lvl{min-width:230px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:9px;transition:width .6s}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.35fr 1fr}
.g2e{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .r{margin-right:auto;font-weight:500;font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{background:var(--p);color:#fff;padding:9px 15px;border-radius:11px;font-weight:700;transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.coral{background:var(--coral)}
.btn.rose{background:var(--rose)}
.btn.lav{background:var(--lav)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.xs{padding:3px 8px;font-size:12px;border-radius:8px}
.btn.big{padding:14px 24px;font-size:17px;border-radius:14px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],input[type=time],input[type=datetime-local],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:9px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--p);background:#fff}
textarea{resize:vertical;line-height:1.7}
input[type=range]{width:100%;accent-color:var(--p)}
input[type=checkbox]{accent-color:var(--p);width:16px;height:16px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.f1{flex:1}
.hide{display:none!important}
.sp{height:16px}
hr{border:none;border-top:1px solid var(--line);margin:10px 0}
/* prayers */
.prayers{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pr{background:var(--bg);border-radius:14px;padding:10px 6px;text-align:center}
.pr b{display:block;font-size:13px;color:var(--muted);font-weight:500}
.pr span{font-size:17px;font-weight:800}
.pr.next{background:var(--p);color:#fff}.pr.next b{color:#fff;opacity:.85}
.pr .ck{margin-top:6px;font-size:12px;padding:3px 8px;border-radius:8px;background:#fff;color:var(--p);font-weight:700}
.pr.next .ck{background:rgba(255,255,255,.25);color:#fff}
.pr.done .ck{background:var(--green);color:#fff}
.countdown{display:flex;align-items:center;gap:12px;margin-bottom:12px;background:var(--p-soft);border-radius:14px;padding:12px 16px;flex-wrap:wrap}
.countdown .t{font-size:24px;font-weight:800;color:var(--p);direction:ltr}
/* lists */
.mis{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:var(--bg);margin-bottom:8px;transition:.25s}
.mis.done{opacity:.55}.mis.done .tx{text-decoration:line-through}
.cb{width:26px;height:26px;border-radius:8px;border:2px solid #D3DCD7;background:#fff;display:grid;place-items:center;flex-shrink:0;font-weight:800;color:#fff;font-size:14px;transition:.15s}
.cb:hover{border-color:var(--p)}
.cb.on{background:var(--green);border-color:var(--green)}
.cb.half{background:var(--sun);border-color:var(--sun)}
.mis .tx{flex:1;line-height:1.5}
.mis .tx small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.ib{font-size:15px;padding:5px 7px;border-radius:8px;color:var(--muted)}
.ib:hover{background:#fff;color:var(--p)}
.xpb{font-size:12px;font-weight:800;color:#C98A00;background:var(--sun-soft);padding:3px 8px;border-radius:8px;white-space:nowrap}
.x{color:var(--muted);padding:4px 7px;border-radius:7px}.x:hover{background:var(--rose-soft);color:var(--rose)}
.trow{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.trow:last-child{border:none}
.trow.done .tt{text-decoration:line-through;color:var(--muted)}
.trow .tt{flex:1;min-width:160px;line-height:1.5}
.trow.late{background:linear-gradient(90deg,transparent,var(--rose-soft))}
.prio-h{background:var(--rose-soft);color:var(--rose)}.prio-m{background:var(--sun-soft);color:#B07A00}.prio-l{background:var(--sky-soft);color:var(--sky)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:7px 13px;border-radius:999px;background:var(--card);font-weight:700;font-size:13px;box-shadow:var(--shadow);color:var(--muted)}
.tab.on{background:var(--p);color:#fff}
.grp{font-size:13px;font-weight:800;color:var(--muted);margin:14px 4px 4px;display:flex;gap:6px;align-items:center}
/* surprise */
.surprise{background:linear-gradient(135deg,#FFF3E8,#FDEBF3 55%,#EEF0FD);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden;box-shadow:var(--shadow);min-height:170px}
.surprise .lab{font-size:13px;font-weight:700;color:var(--coral)}
.surprise .ch{font-size:18px;font-weight:800;line-height:1.6;margin:8px 0 14px}
.surprise .cover{position:absolute;inset:0;background:linear-gradient(135deg,var(--coral),var(--rose));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-weight:800;font-size:18px;transition:.4s}
.surprise .cover span{font-size:40px;animation:wob 2s infinite}
.surprise .cover.gone{opacity:0;pointer-events:none;transform:scale(1.05)}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
/* energy */
.energy{display:flex;gap:8px;flex-wrap:wrap}
.en{flex:1;min-width:80px;padding:10px 6px;border-radius:14px;background:var(--bg);text-align:center;font-weight:700;font-size:13px;border:2px solid transparent}
.en span{display:block;font-size:22px;margin-bottom:3px}
.en.on{border-color:var(--p);background:var(--p-soft)}
.suggest{margin-top:12px;padding:14px;border-radius:14px;background:var(--lav-soft);line-height:1.7}
/* secretary feed */
.sec{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--bg);margin-bottom:7px;line-height:1.6;font-size:14px}
.sec .em{font-size:18px}
.sec.warn{background:var(--rose-soft)}
.sec.good{background:var(--green-soft)}
.sec.info{background:var(--sky-soft)}
/* stats */
.stat{text-align:center;padding:14px}
.stat .n{font-size:28px;font-weight:800}
.stat .l{color:var(--muted);font-size:13px}
.stat .d{font-size:12px;font-weight:700;margin-top:3px}
.up{color:var(--green)}.down{color:var(--rose)}
/* plan timeline */
.tl{position:relative;padding-right:18px}
.tl:before{content:'';position:absolute;right:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tlb{position:relative;display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg);margin-bottom:8px}
.tlb:before{content:'';position:absolute;right:-17px;top:50%;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--c,var(--p));transform:translateY(-50%)}
.tlb .tm{font-size:13px;font-weight:800;direction:ltr;min-width:96px;text-align:left;color:var(--muted)}
.tlb.now{outline:2px solid var(--sun);background:var(--sun-soft)}
.tlb.past{opacity:.5}
.tlb.done{opacity:.5}.tlb.done .tt{text-decoration:line-through}
.tlb .tt{flex:1;line-height:1.5}
.tlb.fixed{background:var(--p-soft)}
/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.wd{background:var(--card);border-radius:14px;padding:10px;box-shadow:var(--shadow);min-height:200px}
.wd h4{font-size:14px;display:flex;justify-content:space-between;margin-bottom:8px}
.wd.today{outline:2px solid var(--p)}
.wt{font-size:12.5px;padding:6px 8px;border-radius:8px;background:var(--bg);margin-bottom:5px;line-height:1.5;border-right:3px solid var(--c,var(--p))}
/* notes */
.notes{columns:3 260px;column-gap:14px}
.note{break-inside:avoid;background:var(--card);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow);cursor:pointer;border-top:5px solid var(--nc,var(--line));transition:.15s}
.note:hover{transform:translateY(-2px)}
.note h4{font-size:15px;margin-bottom:6px;display:flex;gap:6px}
.note .bd{font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:hidden}
.note .meta{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{color:var(--p);font-weight:700}
.ment{color:var(--coral);font-weight:700}
.chk{display:flex;gap:6px;align-items:flex-start}
.chk.on span{text-decoration:line-through;color:var(--muted)}
.colors{display:flex;gap:6px}
.colors button{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.colors button.on{box-shadow:0 0 0 2px var(--ink)}
/* books */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.book{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.book .spine{height:7px}
.book .bd{padding:15px;display:flex;flex-direction:column;gap:7px;flex:1}
.book h4{font-size:16px;font-weight:800;line-height:1.4}
.book .au{color:var(--muted);font-size:13px}
.book .hook{font-size:14px;line-height:1.7;flex:1}
.book .why{font-size:13px;background:var(--bg);border-radius:10px;padding:8px 10px;line-height:1.6}
.book .ft{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.book select{width:auto;padding:5px 8px;font-size:13px}
.stars{color:var(--sun);letter-spacing:1px;font-size:13px}
.featured{display:flex;gap:20px;align-items:center;background:linear-gradient(135deg,var(--p-soft),var(--sky-soft));border-radius:var(--radius);padding:20px;margin-bottom:16px}
.bigb{width:86px;height:118px;border-radius:8px 14px 14px 8px;display:grid;place-items:center;color:#fff;font-size:36px;flex-shrink:0;box-shadow:-6px 6px 0 rgba(0,0,0,.07)}
/* focus */
.focus{display:flex;flex-direction:column;align-items:center;gap:16px;padding:26px}
.ring{position:relative;width:260px;height:260px}
.ring svg{transform:rotate(-90deg)}
.ring .tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .tt b{font-size:48px;font-weight:800;direction:ltr}
/* charts */
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .c i{width:100%;max-width:44px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--p2),var(--p));min-height:4px;transition:height .6s}
.chart .c small{color:var(--muted);font-size:12px}
.chart .c b{font-size:12px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;direction:ltr;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:3px;background:#EBF0ED}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--p) 30%,#fff)}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--p) 55%,#fff)}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--p) 80%,#fff)}
.heat i[data-l="4"]{background:var(--p)}
.heat i.today{outline:2px solid var(--coral)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{text-align:center;padding:14px 8px;border-radius:16px;background:var(--bg);filter:grayscale(1);opacity:.45}
.badge.got{filter:none;opacity:1;background:var(--sun-soft)}
.badge span{font-size:32px;display:block}
.badge b{display:block;margin-top:6px;font-size:13px}
.badge small{color:var(--muted);font-size:11.5px}
.scorering{position:relative;width:150px;height:150px;flex-shrink:0}
.scorering svg{transform:rotate(-90deg)}
.scorering .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scorering .v b{font-size:38px;font-weight:800}
/* habits grid */
.hgrid{width:100%;border-collapse:separate;border-spacing:0 6px}
.hgrid th{font-size:12px;color:var(--muted);font-weight:700;padding:4px}
.hgrid td{background:var(--bg);padding:8px;text-align:center}
.hgrid td:first-child{text-align:right;border-radius:0 12px 12px 0}
.hgrid td:last-child{border-radius:12px 0 0 12px}
.hgrid .today{background:var(--p-soft)}
/* toast / alarm */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(140px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:14px;font-weight:700;transition:.35s;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:299}
.alarm{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;background:rgba(255,138,101,.92);animation:flash 1s infinite}
@keyframes flash{0%,100%{background:rgba(255,138,101,.94)}50%{background:rgba(227,101,136,.94)}}
.alarm .box{background:#fff;border-radius:26px;padding:30px;width:min(480px,92vw);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.alarm .box .ic{font-size:60px;animation:wob .6s infinite}
.alarm .box h2{font-size:24px;margin:10px 0;line-height:1.5}
.quote{font-size:15px;line-height:1.9;padding:12px 16px;border-right:4px solid var(--p);background:var(--p-soft);border-radius:12px}
.lesson{padding:14px;border-radius:14px;background:var(--bg);margin-bottom:10px}
.lesson h5{font-size:15px;margin-bottom:6px}
.lesson p{line-height:1.8;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(36,51,58,.38);display:grid;place-items:center;z-index:200;padding:16px;overflow-y:auto}
.modal>.card{width:min(560px,96vw);max-height:92vh;overflow-y:auto;animation:pop .2s}
.modal>.card.wide{width:min(820px,96vw)}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.formg{display:grid;gap:9px}
.formg label{font-size:13px;color:var(--muted);font-weight:700}
.fab{position:fixed;left:24px;bottom:24px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-size:30px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:120;display:grid;place-items:center;transition:.2s}
.fab:hover{transform:scale(1.08) rotate(90deg)}
.kbd{display:inline-block;background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:12px;font-family:monospace;direction:ltr}
.pal{position:fixed;inset:0;background:rgba(36,51,58,.35);z-index:250;display:flex;justify-content:center;padding-top:12vh}
.pal .box{width:min(620px,94vw);background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden;height:max-content}
.pal input{border:none;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:17px;background:#fff}
.pal .res{max-height:52vh;overflow-y:auto;padding:6px}
.pal .it{display:flex;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;align-items:center}
.pal .it.on,.pal .it:hover{background:var(--p-soft)}
.pal .it small{color:var(--muted);margin-right:auto;font-size:12px}
.qc .modes{display:flex;gap:6px;margin-bottom:10px}
.qc .modes button{flex:1;padding:9px;border-radius:11px;background:var(--bg);font-weight:700}
.qc .modes button.on{background:var(--p);color:#fff}
.qc textarea{font-size:16px}

function dkey(d){d=d instanceof Date?d:new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

const tmin=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};

 for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*300,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,s:Math.random()*7+4,c:pick(cols),r:Math.random()*6,life:120});

  switch(kind){
   case'alarm':for(let i=0;i<6;i++){tone(i%2?1180:880,i*.18,.16,'square',V(.55))}break;
   case'digital':for(let r=0;r<3;r++)for(let i=0;i<4;i++)tone(2000,r*.5+i*.09,.06,'square',V(.4));break;
   case'bell':[523,1046,1568].forEach((f,i)=>tone(f,0,2.2-i*.5,'sine',V(.45/(i+1))));tone(659,.6,2,'sine',V(.3));break;
   case'chime':[523,659,784,1046].forEach((f,i)=>tone(f,i*.16,.7,'triangle',V(.45)));break;
   case'gentle':[440,554,659].forEach((f,i)=>tone(f,i*.3,1.2,'sine',V(.25)));break;
  }}

const PR_WORDS={فجر:'Fajr',ضهر:'Dhuhr',ظهر:'Dhuhr',عصر:'Asr',مغرب:'Maghrib',عشا:'Isha',عشاء:'Isha',عشاءً:'Isha'};
const DAY_WORDS=[[/(يوم\s+)?(السبت)/,6],[/(يوم\s+)?(الحد|الأحد|الاحد)/,0],[/(يوم\s+)?(الاتنين|الإثنين|الاثنين|الأتنين)/,1],[/(يوم\s+)?(التلات|الثلاثاء|التلاتاء|الثلاث)/,2],[/(يوم\s+)?(الأربع|الاربع|الأربعاء|الاربعاء)/,3],[/(يوم\s+)?(الخميس)/,4],[/(يوم\s+)?(الجمعة|الجمعه)/,5]];
function parseWhen(input){
  let t=' '+normDigits(input).replace(/^\s*(ذك+رني|ذكّرني|فكرني|فكّرني|نبهني|نبّهني)(\s+(إني|اني|إن|ان)(?=\s))?\s+/,'')+' ';const now=new Date();let found=[];const cut=re=>{const m=t.match(re);if(m){found.push(m[0].trim());t=t.replace(m[0],' ')}return m};
  let m;
  // relative
  let rel=null;
  if(m=cut(/بعد\s+(\d+)\s*(دقيقه|دقيقة|دقايق|دقائق|د)(?=\s)/))rel=+m[1];
  else if(m=cut(/بعد\s+(نص|نصف)\s+ساع[ةه]/))rel=30;
  else if(m=cut(/بعد\s+ربع\s+ساع[ةه]/))rel=15;
  else if(m=cut(/بعد\s+ساع[ةه]\s+ونص/))rel=90;
  else if(m=cut(/بعد\s+ساعتين/))rel=120;
  else if(m=cut(/بعد\s+(\d+)\s*(ساعات|ساعة|ساعه|س)(?=\s)/))rel=+m[1]*60;
  else if(m=cut(/بعد\s+ساع[ةه]/))rel=60;
  if(rel!==null){const at=new Date(Date.now()+rel*6e4);return{at:at.getTime(),clean:t.trim().replace(/\s+/g,' '),label:fmtWhen(at)}}
  let dk=null;
  if(cut(/بعد\s+بكر[ةه]/))dk=addDays(today(),2);
  else if(cut(/(بكر[ةه]|غداً|غدا)(?=\s)/))dk=addDays(today(),1);
  else if(cut(/(النهارد[ةه]|اليوم)(?=\s)/))dk=today();
  else if(m=cut(/الأسبوع\s+الجاي|الاسبوع\s+الجاي/))dk=addDays(today(),7);
  else for(const[re,wd]of DAY_WORDS){if(m=cut(re)){let diff=(wd-now.getDay()+7)%7;if(diff===0)diff=7;dk=addDays(today(),diff);break}}
  let mins=null;
  if(m=cut(/(بعد|قبل|مع)\s+(ال)?(فجر|ضهر|ظهر|عصر|مغرب|عشاء|عشا)/)){const k=PR_WORDS[m[3]];const base=PT&&PT.times[k]?tmin(PT.times[k]):({Fajr:330,Dhuhr:750,Asr:930,Maghrib:1050,Isha:1140})[k];mins=base+(m[1]==='بعد'?20:m[1]==='قبل'?-20:0)}
  if(mins===null){
    let h=null,mm=0,q=null;
    if(m=cut(/(?:الساع[ةه]|س)\s*(\d{1,2})(?::(\d{2}))?(\s*و\s*نص|\s*ونص|\s*وربع|\s*الا\s*ربع|\s*إلا\s*ربع)?(\s*(الصبح|صباحا|صباحاً|ص|الضهر|الظهر|العصر|المغرب|بالليل|بليل|مساء|مساءً|م)(?=\s))?/)){h=+m[1];mm=m[2]?+m[2]:0;if(m[3]){if(/نص/.test(m[3]))mm=30;else if(/الا|إلا/.test(m[3])){h-=1;mm=45}else mm=15}q=m[5]||null}
    else if(m=cut(/(\d{1,2}):(\d{2})(\s*(الصبح|صباحا|ص|الضهر|الظهر|العصر|المغرب|بالليل|بليل|مساء|م)(?=\s))?/)){h=+m[1];mm=+m[2];q=m[4]||null}
    else if(m=cut(/(\d{1,2})(\s*ونص|\s*وربع)?\s*(الصبح|صباحا|صباحاً|ص|الضهر|الظهر|العصر|المغرب|بالليل|بليل|مساء|مساءً|م)(?=\s)/)){h=+m[1];if(m[2])mm=/نص/.test(m[2])?30:15;q=m[3]}
    if(h!==null&&h<=24){
      if(q&&/الصبح|صباح|^ص$/.test(q)){if(h===12)h=0}
      else if(q&&/ضهر|ظهر/.test(q)){if(h<6)h+=12}
      else if(q){if(h<12)h+=12;if(/ليل/.test(q)&&h===24)h=0}
      else if(h>=1&&h<=7)h+=12;
      mins=h*60+mm}
  }
  if(dk===null&&mins===null)return null;
  if(dk===null){dk=today();if(mins<=nowMin())dk=addDays(dk,1)}
  if(mins===null)mins=10*60;
  const at=new Date(dk+'T00:00');at.setMinutes(mins);
  return{at:at.getTime(),clean:t.trim().replace(/\s+/g,' '),label:fmtWhen(at)};
}

function nextRepeat(r){const d=new Date(r.at);
  if(r.repeat==='daily')d.setDate(d.getDate()+1);
  else if(r.repeat==='weekdays'){do{d.setDate(d.getDate()+1)}while([0,6].includes(d.getDay()))}
  else if(r.repeat==='weekly')d.setDate(d.getDate()+7);
  else if(r.repeat==='monthly')d.setMonth(d.getMonth()+1);
  else if(r.repeat==='hourly')d.setHours(d.getHours()+1);
  while(d.getTime()<Date.now()-6e4){if(r.repeat==='hourly')d.setHours(d.getHours()+1);else d.setDate(d.getDate()+1)}
  return d.getTime()}
function addReminder(t,at,opt={}){const r=Object.assign({id:uid('r'),t,at,repeat:'none',sound:null,done:false,fired:false,created:Date.now(),cat:'work'},opt);S.reminders.push(r);save();renderTop();return r}
function fireReminder(r,silent){
  if(r.repeat&&r.repeat!=='none'){r.lastFired=r.at;r.at=nextRepeat(r)}else r.fired=true;save();renderCounts();
  if(silent)return;
  raiseAlarm({id:r.id,t:r.t,sub:'تذكير · '+(r.repeat&&r.repeat!=='none'?'متكرر':fmtWhen(r.lastFired||r.at)),body:r.body,sound:r.sound,icon:'⏰',
   onOk:()=>{if(!r.repeat||r.repeat==='none'){r.done=true;r.doneAt=Date.now()}save();refresh();if(r.task){const tk=S.tasks.find(x=>x.id===r.task);tk&&tk.status!=='done'&&toast('💡 لو خلصت المهمة علّم عليها في المهام')}},
   onSnooze:m=>{if(r.repeat&&r.repeat!=='none'){addReminder('🔁 '+r.t,Date.now()+m*6e4,{snoozed:true})}else{r.at=Date.now()+m*6e4;r.fired=false}save();refresh()}});
}
let missed=[];
function checkReminders(initial){
  const now=Date.now();
  S.reminders.forEach(r=>{if(r.done||r.fired||r.at>now)return;
    if(initial&&now-r.at>5*6e4){missed.push({t:r.t,at:r.at});fireReminder(r,true)}else fireReminder(r)});
  if(initial&&missed.length){setTimeout(()=>modal(`<h3>🔔 فاتتك تذكيرات وإنت مش هنا</h3>${missed.map(m=>`<div class="sec warn"><span class="em">⏰</span><div>${esc(m.t)}<div class="muted small">${fmtWhen(m.at)}</div></div></div>`).join('')}<div class="row" style="margin-top:10px"><button class="btn" onclick="closeModal();go('rem')">افتح التذكيرات</button><button class="btn ghost" onclick="closeModal()">تمام</button></div>`),1200);missed=[]}
  checkSystem();

function once(key){if(S.sysFired[key])return false;S.sysFired[key]=Date.now();save();return true}

  if(PT){PR.forEach(([k,a])=>{if(k==='Sunrise')return;const pm=tmin(PT.times[k]);

  if(st.briefOn&&n>=tmin(st.brief)&&n<tmin(st.brief)+180&&!day().briefed&&once('brief-'+t)){openBrief(true)}
  if(st.reviewOn&&n>=tmin(st.review)&&n<tmin(st.review)+120&&!day().review&&once('review-'+t)){raiseAlarm({t:'وقت مراجعة اليوم 🪞',sub:'السكرتير',body:'3 دقايق: إيه اللي خلص، إيه اللي يتنقل لبكرة، وإنت عامل إيه.',icon:'🪞',sound:'gentle',onOk:()=>openReview()})}
  const inWork=n>=tmin(st.workFrom)&&n<=tmin(st.workTo);
  if(st.nudge&&inWork&&Date.now()-S.lastAct>st.nudgeMin*6e4&&once('nudge-'+t+'-'+Math.floor(n/st.nudgeMin))){const r=pick(RESCUE);const open=S.tasks.filter(x=>x.status!=='done').sort(taskSort)[0];
    raiseAlarm({t:'إنت فين؟ 👀 بقالك فترة من غير إنجاز',sub:'السكرتير',body:(open?`أقترح تبدأ في: «${open.t}». `:'')+r[1],icon:'🤵',sound:'chime',go:'focus'})}
  if(st.water&&n>=tmin('09:00')&&n<=tmin('22:00')&&n%90<1.5&&once('water-'+t+'-'+Math.floor(n/90)))raiseAlarm({t:'اشرب كوباية مية 💧',sub:'صحة',icon:'💧',sound:'gentle',loud:false,onOk:()=>{day().water=(day().water||0)+1;save()}});

  if(st.fast&&(wd===0||wd===3)&&n>=1260&&n<1380&&once('fast-'+t))raiseAlarm({t:`بكرة ${wd===0?'الاتنين':'الخميس'} — نية صيام؟`,sub:'تذكير سنة',icon:'🌙',sound:'gentle',loud:false});
  if(st.weekly&&wd===0&&n>=1200&&n<1320&&once('weekly-'+t))raiseAlarm({t:'المراجعة الأسبوعية 🗓️',sub:'السكرتير',body:'إيه اللي نجح؟ إيه اللي تعبك؟ وإيه أهم عادة للأسبوع الجاي؟',icon:'🗓️',sound:'chime',go:'journey'});
  if(st.followups&&n>=660&&n<1080&&overdueContacts().length&&once('fu-'+t)){const o=overdueContacts();raiseAlarm({t:`عندك ${o.length} متابعة متأخرة`,sub:'الناس والإيجنتس',body:o.slice(0,5).map(c=>c.name).join('، '),icon:'🤝',sound:'chime',go:'people'})}
  const pl=day().plan;if(st.blockAlerts&&pl)pl.forEach(b=>{if(!b.fixed&&!b.done&&n>=b.s&&n<b.s+2&&once('blk-'+t+'-'+b.s))raiseAlarm({t:'دلوقتي: '+b.t,sub:`خطة اليوم · ${minToHM(b.s)}–${minToHM(b.e)}`,icon:'🗓️',sound:'chime',go:'sec'})});
  // task due-time alarms
  S.tasks.forEach(tk=>{if(tk.status==='done'||!tk.due||!tk.time)return;const at=new Date(tk.due+'T'+tk.time).getTime();if(Date.now()>=at&&Date.now()-at<5*6e4&&once('task-'+tk.id+'-'+tk.due+tk.time))raiseAlarm({t:tk.t,sub:'مهمة ميعادها دلوقتي',icon:'✅',go:'tasks',onSnooze:m=>{addReminder(tk.t,Date.now()+m*6e4,{task:tk.id})}})});
}

/* ICS export (so your phone calendar rings even if the site is closed) */
function icsExport(){
  const z=d=>{d=new Date(d);return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z'};
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Hayati//AR','CALSCALE:GREGORIAN'];
  const add=(id,t,at,rr,desc)=>{L.push('BEGIN:VEVENT','UID:'+id+'@hayati','DTSTAMP:'+z(Date.now()),'DTSTART:'+z(at),'DTEND:'+z(at+15*6e4),'SUMMARY:'+t.replace(/[,;\n]/g,' '));if(desc)L.push('DESCRIPTION:'+desc.replace(/[,;\n]/g,' '));if(rr)L.push('RRULE:'+rr);L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+t.replace(/[,;\n]/g,' '),'TRIGGER:-PT0M','END:VALARM','END:VEVENT')};
  const RR={daily:'FREQ=DAILY',weekly:'FREQ=WEEKLY',monthly:'FREQ=MONTHLY',weekdays:'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR',hourly:'FREQ=HOURLY'};
  let n=0;S.reminders.filter(r=>!r.done&&(r.at>Date.now()||RR[r.repeat])).forEach(r=>{add(r.id,r.t,r.at,RR[r.repeat],r.body);n++});
  S.tasks.filter(t=>t.status!=='done'&&t.due&&t.due>=today()).forEach(t=>{add(t.id,'✅ '+t.t,new Date(t.due+'T'+(t.time||'10:00')).getTime());n++});
  const st=S.settings;if(st.reviewOn){const d=new Date(today()+'T'+st.review);add('review','🪞 مراجعة اليوم في حياتي',d.getTime(),'FREQ=DAILY');n++}
  if(st.briefOn){const d=new Date(addDays(today(),1)+'T'+st.brief);add('brief','🤵 الصبح: افتح حياتي وشوف خطة اليوم',d.getTime(),'FREQ=DAILY');n++}
  L.push('END:VCALENDAR');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar'}));a.download='hayati-reminders.ics';a.click();
  toast(`📅 اتعمل ملف فيه ${n} تذكير — افتحه على الموبايل يضيفهم للكالندر`)}

  cats.forEach(c=>{const opts=allMissions().filter(m=>m.cat===c&&!m.once&&!out.includes(m.id));if(opts.length)out.push(pick(opts,r).id)});return out}

  d.done.push(id);S.stats.missions++;sfx('done');addXP(m.xp,m.cat,pick(['💪 عاش!','🔥 كمّل كده','👏 برافو','✨ خطوة كمان','🚀 إنت جامد','🌟 ما شاء الله']));

/* ================== MORNING BRIEF ================== */

  const sel=new Set(d.top3.filter(x=>x.task).map(x=>x.task));const custom=d.top3.filter(x=>!x.task).map(x=>x.t);
  const rems=S.reminders.filter(r=>!r.done&&dkey(r.at)===today()).sort((a,b)=>a.at-b.at);
  const mo=curMonth(),wk=curWeek();
  modal(`<h3>🌅 صباح الخير يا ${esc(S.name)} <span class="r">${new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})}</span></h3>
   <div class="quote">${pick(QUOTES)}</div>
   <div class="row wrap small muted" style="margin:10px 0;gap:14px">${WX?`<span>${WX.icon} ${WX.desc} ${WX.min}°–${WX.max}°${WX.rain>=40?' · ☔ '+WX.rain+'%':''}</span>`:''}${PT?PR.filter(p=>p[0]!=='Sunrise').map(([k,a])=>`<span>${a} <b>${PT.times[k]}</b></span>`).join(''):''}</div>
   ${mo?`<div class="sec info"><span class="em">🗺️</span><div>تركيز الشهر: <b>${esc(mo[1])}</b> — ${esc(mo[2])}${wk?`<br>تحدي الأسبوع: <b>${esc(wk.w[3])}</b>`:''}</div></div>`:''}
   ${rems.length?`<div class="sec"><span class="em">⏰</span><div>تذكيرات النهارده: ${rems.map(r=>`<b>${hm(r.at)}</b> ${esc(r.t)}`).join(' · ')}</div></div>`:''}
   ${overdueContacts().length?`<div class="sec warn"><span class="em">🤝</span><div>متابعات: ${overdueContacts().slice(0,5).map(c=>esc(c.name)).join('، ')}</div></div>`:''}
   <h3 style="margin-top:14px">⭐ اختار أهم 3 حاجات النهارده</h3>
   <div id="bfList" style="max-height:240px;overflow-y:auto">${open.slice(0,15).map(t=>`<label class="mis" style="cursor:pointer"><input type="checkbox" value="${t.id}" ${sel.has(t.id)?'checked':''}><div class="tx">${esc(t.t)}<small>${chip(t.cat)} <span class="chip prio-${t.prio}">${t.due?fmtDay(t.due):'من غير ميعاد'}</span></small></div></label>`).join('')||'<div class="muted small">مفيش مهام — اكتب تحت</div>'}</div>
   <div class="col" style="margin-top:8px">${[0,1,2].map(i=>`<input type="text" class="bfC" placeholder="أو اكتب حاجة ${i+1}…" value="${esc(custom[i]||'')}">`).join('')}</div>
   <div class="row wrap" style="margin-top:14px"><button class="btn" id="bfOk">🗓️ تمام — اعملي خطة اليوم</button><button class="btn ghost" id="bfOnly">حفظ بس</button></div>`,()=>{
   const lim=()=>{const c=$$('#bfList input:checked');$$('#bfList input').forEach(i=>i.disabled=!i.checked&&c.length>=3)};$$('#bfList input').forEach(i=>i.onchange=lim);lim();
   const saveB=()=>{const top=[];$$('#bfList input:checked').forEach(i=>{const t=S.tasks.find(x=>x.id===i.value);top.push({t:t.t,task:t.id})});$$('.bfC').forEach(i=>{const v=i.value.trim();if(v&&top.length<3)top.push({t:v,done:false})});
     d.top3=top.slice(0,3);if(!d.briefed){d.briefed=true;addXP(10,'self','🌅 بداية منظمة')}save()};
   $('#bfOk').onclick=()=>{saveB();closeModal();generatePlan();go('sec');toast('🤵 الخطة جاهزة')};
   $('#bfOnly').onclick=()=>{saveB();closeModal();refresh()};
  },true);
  if(auto)playSound('gentle')}

/* ================== EVENING REVIEW ================== */
function openReview(){const d=day(),t=today();const pend=S.tasks.filter(x=>x.status!=='done'&&x.due&&x.due<=t);
  const doneT=S.tasks.filter(x=>x.status==='done'&&x.doneAt&&dkey(x.doneAt)===t);const rv=d.review||{};
  const pickRow=(id,label,v)=>`<div><label class="small muted" style="font-weight:700">${label}</label><div class="row" id="${id}" style="gap:6px;margin-top:4px">${[1,2,3,4,5].map(n=>`<button class="btn ${v===n?'':'ghost'} sm" data-v="${n}">${['😣','😕','😐','🙂','😄'][n-1]} ${n}</button>`).join('')}</div></div>`;
  modal(`<h3>🪞 مراجعة اليوم <span class="r">3 دقايق بس</span></h3>
   <div class="grid g3" style="margin-bottom:10px"><div class="stat card" style="box-shadow:none;background:var(--bg)"><div class="n">${dayScore()}</div><div class="l">نقاط اليوم</div></div><div class="stat card" style="box-shadow:none;background:var(--bg)"><div class="n">${doneT.length+d.done.length}</div><div class="l">حاجة خلصت</div></div><div class="stat card" style="box-shadow:none;background:var(--bg)"><div class="n">${d.fmins||0}</div><div class="l">دقيقة تركيز</div></div></div>
   ${pend.length?`<label class="small muted" style="font-weight:700">مهام مخلصتش — أنقلها لبكرة؟</label><div style="max-height:170px;overflow-y:auto">${pend.map(x=>`<label class="mis" style="cursor:pointer;padding:8px"><input type="checkbox" class="rvMove" value="${x.id}" checked><div class="tx small">${esc(x.t)}</div></label>`).join('')}</div>`:'<div class="sec good"><span class="em">🎉</span><div>كل مهام النهارده خلصت!</div></div>'}
   <div class="grid g3" style="margin:10px 0">${pickRow('rvMood','مزاجي',rv.mood)}${pickRow('rvEn','طاقتي',rv.energy)}${pickRow('rvCalm','هدوئي',rv.calm)}</div>
   <div class="formg"><label>أهم إنجاز النهارده</label><input type="text" id="rvWin" value="${esc(rv.win||'')}"><label>اتعلمت إيه / موقف تصرفت فيه بهدوء</label><input type="text" id="rvLes" value="${esc(rv.lesson||'')}"><label>حاجة ممتن ليها 🤲</label><input type="text" id="rvGr" value="${esc(rv.grat||'')}">
   <label>نمت كام ساعة امبارح؟</label><input type="number" id="rvSl" min="0" max="14" step=".5" value="${d.sleep||''}" style="width:120px"></div>
   <div class="row" style="margin-top:14px"><button class="btn" id="rvOk">حفظ المراجعة ${d.review?'':'+30 XP'}</button><button class="btn ghost" onclick="closeModal()">بعدين</button></div>`,()=>{
   const val={mood:rv.mood,energy:rv.energy,calm:rv.calm};[['rvMood','mood'],['rvEn','energy'],['rvCalm','calm']].forEach(([id,k])=>$$('#'+id+' button').forEach(b=>b.onclick=()=>{val[k]=+b.dataset.v;$$('#'+id+' button').forEach(x=>x.classList.toggle('ghost',x!==b))}));
   $('#rvOk').onclick=()=>{let moved=0;$$('.rvMove:checked').forEach(i=>{const x=S.tasks.find(t=>t.id===i.value);if(x){x.due=addDays(today(),1);moved++}});
     const first=!d.review;d.review={...val,win:$('#rvWin').value,lesson:$('#rvLes').value,grat:$('#rvGr').value,at:Date.now()};d.sleep=+$('#rvSl').value||d.sleep;d.mood=val.mood;d.energy=val.energy;d.calm=val.calm;
     if(d.review.lesson){const j=S.journal.find(x=>x.d===today());if(j)j.t=d.review.lesson;else{S.journal.push({d:today(),t:d.review.lesson});S.stats.journal++}}
     if(first){S.stats.reviews++;addXP(30,'self','🪞 مراجعة محترمة')}else save();closeModal();toast(moved?`📦 نقلت ${moved} مهمة لبكرة — نام وإنت مرتاح`:'✓ اتحفظت');refresh()}},true)}

/* ================== SECRETARY: PLAN ================== */
const taskSort=(a,b)=>{const po={h:0,m:1,l:2};const da=a.due||'9999',db=b.due||'9999';return(da<db?-1:da>db?1:0)||po[a.prio]-po[b.prio]};
function generatePlan(k=today()){const st=S.settings,d=day(k),isToday=k===today();
  let start=isToday?Math.ceil(nowMin()/15)*15:Math.max(tmin('06:00'),PT?tmin(PT.times.Fajr):330);start=Math.max(start,isToday?0:330);
  let end=tmin(st.sleep);if(end<start+60)end=1439;
  const fixed=[];
  if(PT)PR.forEach(([kk,a])=>{if(kk==='Sunrise')return;const s=tmin(PT.times[kk]);const jum=kk==='Dhuhr'&&new Date(k+'T12:00').getDay()===5;fixed.push({s,e:s+(jum?60:20),t:jum?'🕌 صلاة الجمعة':'🕌 صلاة '+a,cat:'deen',fixed:true,kind:'pray'})});
  S.reminders.filter(r=>!r.done&&dkey(r.at)===k).forEach(r=>{const s=new Date(r.at).getHours()*60+new Date(r.at).getMinutes();fixed.push({s,e:s+15,t:'⏰ '+r.t,cat:r.cat||'work',fixed:true,kind:'rem'})});
  S.tasks.filter(t=>t.status!=='done'&&t.due===k&&t.time).forEach(t=>{const s=tmin(t.time);fixed.push({s,e:s+(t.est||30),t:t.t,cat:t.cat,fixed:true,task:t.id,kind:'task'})});
  fixed.push({s:end-25,e:end-10,t:'🪞 مراجعة اليوم',cat:'self',fixed:true,kind:'review'});
  fixed.sort((a,b)=>a.s-b.s);
  // flexible queue
  const q=[];const used=new Set(fixed.filter(f=>f.task).map(f=>f.task));
  d.top3.forEach(x=>{if(x.task){const t=S.tasks.find(y=>y.id===x.task);if(t&&t.status!=='done'&&!used.has(t.id)){q.push({t:'⭐ '+t.t,cat:t.cat,dur:t.est||45,task:t.id,work:t.cat==='work'});used.add(t.id)}}else if(!x.done)q.push({t:'⭐ '+x.t,cat:'work',dur:45,work:true})});
  S.tasks.filter(t=>t.status!=='done'&&!used.has(t.id)&&!t.time&&(!t.due||t.due<=addDays(k,isToday?0:0)||(t.due<=addDays(k,2)&&t.prio==='h'))).sort(taskSort).slice(0,10).forEach(t=>{q.push({t:t.t,cat:t.cat,dur:t.est||30,task:t.id,work:t.cat==='work'});used.add(t.id)});
  const extra=[];
  if(PT){const asr=tmin(PT.times.Asr),mag=tmin(PT.times.Maghrib),isha=tmin(PT.times.Isha);
    extra.push({after:asr+20,t:'🚶 مشي / حركة',cat:'body',dur:20},{after:mag+20,t:'👨‍👩‍👦 وقت للعيلة من غير موبايل',cat:'family',dur:30},{after:isha+20,t:'📖 قراءة كتابك',cat:'learn',dur:25});
    if(nowMin()<tmin(PT.times.Sunrise)+60||!isToday)extra.push({after:tmin(PT.times.Fajr)+20,t:'📿 أذكار الصباح + ورد قرآن',cat:'deen',dur:15});
    extra.push({after:asr+40,t:'📿 أذكار المساء',cat:'deen',dur:10})}
  // build free slots
  const blocks=[...fixed.filter(f=>f.e>start&&f.s<end)];let cur=start,workRun=0;const wf=tmin(st.workFrom),wt=tmin(st.workTo);
  const busy=(s,e)=>blocks.some(b=>s<b.e&&e>b.s);
  const nextFree=(s)=>{let x=s;let moved=true;while(moved){moved=false;for(const b of blocks){if(x>=b.s&&x<b.e){x=b.e;moved=true}}}return x};
  const place=(item,from)=>{let s=nextFree(Math.max(from,start));let remain=item.dur;let guard=0;
    while(remain>0&&s<end&&guard++<50){const nb=blocks.filter(b=>b.s>=s).sort((a,b)=>a.s-b.s)[0];const lim=Math.min(nb?nb.s:end,end);const room=lim-s;
      if(room<15){s=nextFree(lim);continue}
      const chunk=Math.min(remain,room,50);blocks.push({s,e:s+chunk,t:item.t+(remain!==item.dur?' (كمّل)':''),cat:item.cat,task:item.task,kind:'flex'});remain-=chunk;s+=chunk;
      if(chunk>=45&&s+10<=lim){blocks.push({s,e:s+10,t:'☕ بريك — قوم اتحرك',cat:'body',kind:'break'});s+=10}
      s=nextFree(s)}
    return s};
  extra.forEach(x=>{if(x.after>=start&&x.after<end&&!busy(x.after,x.after+x.dur))blocks.push({s:x.after,e:x.after+x.dur,t:x.t,cat:x.cat,kind:'habit'})});
  q.forEach(item=>{cur=place(item,item.work?Math.max(cur,isToday?start:wf):cur)});
  blocks.sort((a,b)=>a.s-b.s);d.plan=blocks.map(b=>({...b,done:false}));d.planAt=Date.now();save();return d.plan}
R.sec=()=>{const d=day();if(!d.plan)generatePlan();
  $('#v-sec').innerHTML=`<div class="row wrap" style="margin-bottom:14px"><div class="seg" id="secSeg"><button data-s="day" class="on">🗓️ خطة اليوم</button><button data-s="week">📅 خطة الأسبوع</button></div><div class="f1"></div>
   <button class="btn sm" id="sBrief">🌅 ملخص الصبح</button><button class="btn ghost sm" id="sRegen">🔄 أعد ترتيب يومي</button><button class="btn ghost sm" id="sAdd">＋ بلوك</button><button class="btn ghost sm" id="sRev">🪞 مراجعة</button></div>
   <div id="secBody"></div>`;
  $('#sBrief').onclick=()=>openBrief();$('#sRev').onclick=()=>openReview();
  $('#sRegen').onclick=()=>{generatePlan();renderPlan();toast('🤵 رتبتلك اليوم من جديد')};
  $('#sAdd').onclick=()=>modal(`<h3>＋ بلوك في الخطة</h3><div class="formg"><label>إيه؟</label><input type="text" id="bkT"><div class="row"><div class="f1"><label>الساعة</label><input type="time" id="bkS" value="${minToHM(Math.ceil(nowMin()/15)*15)}"></div><div class="f1"><label>المدة (دقيقة)</label><input type="number" id="bkD" value="30"></div></div><label>المجال</label><select id="bkC">${catOpts('work')}</select><button class="btn" id="bkOk">إضافة</button></div>`,()=>{$('#bkOk').onclick=()=>{const t=$('#bkT').value.trim();if(!t)return;const s=tmin($('#bkS').value);day().plan.push({s,e:s+(+$('#bkD').value||30),t,cat:$('#bkC').value,kind:'manual',done:false});day().plan.sort((a,b)=>a.s-b.s);save();closeModal();renderPlan()}});
  let mode='day';$$('#secSeg button').forEach(b=>b.onclick=()=>{mode=b.dataset.s;$$('#secSeg button').forEach(x=>x.classList.toggle('on',x===b));mode==='day'?renderPlan():renderWeek()});
  renderPlan()};
function renderPlan(){const d=day(),n=nowMin(),pl=d.plan||[];
  const flexMin=pl.filter(b=>b.kind==='flex').reduce((a,b)=>a+b.e-b.s,0);
  $('#secBody').innerHTML=`<div class="grid g2"><div class="card"><h3>🗓️ يومك متقسم <span class="r">${pl.length} بلوك · ${Math.round(flexMin/60*10)/10} ساعة شغل مركز</span></h3>
   <div class="tl">${pl.map((b,i)=>{const c=(CATS[b.cat]||CATS.work).c;const now=n>=b.s&&n<b.e,past=n>=b.e;return`<div class="tlb ${b.fixed?'fixed':''} ${now?'now':''} ${past&&!b.done?'past':''} ${b.done?'done':''}" style="--c:${c}">
     <span class="tm">${minToHM(b.s)} – ${minToHM(b.e)}</span><span class="tt">${esc(b.t)}${now?' <span class="chip" style="background:var(--sun);color:#fff">دلوقتي</span>':''}</span>
     ${b.kind==='break'||b.kind==='pray'?'':`<button class="ib" data-pf="${i}" title="ركّز">🎯</button>`}<button class="ib" data-pd="${i}" title="تم">${b.done?'↩':'✓'}</button><button class="ib" data-px="${i}" title="شيل">✕</button></div>`}).join('')||'<div class="empty">مفيش خطة — دوس «أعد ترتيب يومي»</div>'}</div></div>
   <div class="grid" style="align-content:start"><div class="card"><h3>🤵 ملاحظات السكرتير</h3><div id="secFeed2">${feedHTML()}</div></div>
    <div class="card"><h3>⚙️ إزاي بخطط؟</h3><p class="small muted" style="line-height:1.9">• الصلوات والتذكيرات والمهام اللي ليها ساعة = ثابتة.<br>• أهم 3 حاجات بتاعتك أول حاجة، وبعدين المتأخر والعاجل.<br>• الشغل في ساعات الشغل (${S.settings.workFrom}–${S.settings.workTo})، وكل 50 دقيقة بريك 10.<br>• بعد العصر حركة، بعد المغرب عيلة، بعد العشا قراءة.<br>• غيّر الساعات من الإعدادات. ولو عايز تنبيه مع بداية كل بلوك فعّله هناك.</p>
     <label class="row small" style="margin-top:8px"><input type="checkbox" id="blkAl" ${S.settings.blockAlerts?'checked':''}> نبّهني بصوت مع بداية كل بلوك</label></div></div></div>`;
  bindFeed($('#secFeed2'));$('#blkAl').onchange=e=>{S.settings.blockAlerts=e.target.checked;save();toast(e.target.checked?'🔔 هنبهك مع كل بلوك':'🔕 اتقفل')};
  $$('[data-pd]').forEach(b=>b.onclick=()=>{const x=pl[+b.dataset.pd];x.done=!x.done;if(x.task){const t=S.tasks.find(y=>y.id===x.task);if(t&&(x.done!==(t.status==='done')))toggleTask(t.id)}else if(x.done)addXP(10,x.cat,'✓ بلوك خلص');save();renderPlan()});
  $$('[data-px]').forEach(b=>b.onclick=()=>{pl.splice(+b.dataset.px,1);save();renderPlan()});
  $$('[data-pf]').forEach(b=>b.onclick=()=>{const x=pl[+b.dataset.pf];go('focus');$('#fTask').value=x.t.replace('⭐ ','');startFocus(Math.min(50,Math.max(15,x.e-x.s)))})}
function renderWeek(){const days=[...Array(7)].map((_,i)=>addDays(today(),i));const cap=S.settings.capacity;
  const open=S.tasks.filter(t=>t.status!=='done');const load={};days.forEach(k=>load[k]=open.filter(t=>t.due===k).reduce((a,t)=>a+(t.est||30),0));
  const sugg={};days.forEach(k=>sugg[k]=[]);
  open.filter(t=>!t.due).sort(taskSort).forEach(t=>{const wkEnd=k=>[0,6].includes(new Date(k+'T12:00').getDay());const k=days.filter(x=>!(t.cat==='work'&&wkEnd(x))).sort((a,b)=>load[a]/(wkEnd(a)?cap/3:cap)-load[b]/(wkEnd(b)?cap/3:cap))[0];if(k){sugg[k].push(t);load[k]+=(t.est||30)}});
  const wk=curWeek();
  $('#secBody').innerHTML=`${wk?`<div class="sec info" style="margin-bottom:12px"><span class="em">🗺️</span><div>تحدي الأسبوع (${esc(wk.w[2])}): <b>${esc(wk.w[3])}</b></div></div>`:''}
   <div class="week">${days.map(k=>{const pct=Math.round(load[k]/cap*100);const ts=open.filter(t=>t.due===k).sort(taskSort);const rs=S.reminders.filter(r=>!r.done&&dkey(r.at)===k);
   return`<div class="wd ${k===today()?'today':''}"><h4><span>${dayName(k)}</span><span class="muted small">${fmtDay(k)===dayName(k)?k.slice(5):fmtDay(k)}</span></h4>
    <div class="bar" style="margin-bottom:8px" title="${pct}% من طاقتك"><i style="width:${Math.min(100,pct)}%;${pct>100?'background:var(--rose)':''}"></i></div>
    ${rs.map(r=>`<div class="wt" style="--c:var(--sun)">⏰ ${hm(r.at)} ${esc(r.t)}</div>`).join('')}
    ${ts.map(t=>`<div class="wt" style="--c:${(CATS[t.cat]||CATS.work).c}">${t.prio==='h'?'🔴 ':''}${esc(t.t)}</div>`).join('')}
    ${sugg[k].map(t=>`<div class="wt" style="--c:var(--lav);border-style:dashed;opacity:.8">💡 ${esc(t.t)}</div>`).join('')}
    ${!ts.length&&!rs.length&&!sugg[k].length?'<div class="muted small">فاضي 🌿</div>':''}</div>`}).join('')}</div>
   <div class="row wrap" style="margin-top:14px"><span class="muted small">💡 المهام اللي من غير ميعاد السكرتير اقترح توزيعها (المنقّط). عجبك التوزيع؟</span><button class="btn sm" id="wkFix">ثبّت التوزيع</button></div>`;
  $('#wkFix').onclick=()=>{let n=0;days.forEach(k=>sugg[k].forEach(t=>{t.due=k;n++}));save();renderWeek();toast(`📅 ثبّتت ${n} مهمة على أيام الأسبوع`)}}

/* ================== DASHBOARD ================== */
function weekCats(offset=0){const tot={};for(let i=0;i<7;i++){const k=addDays(today(),-i-offset*7);const c=(S.days[k]||{cats:{}}).cats;for(const x in c)tot[x]=(tot[x]||0)+c[x]}return tot}
function sumDays(n,off,f){let s=0;for(let i=0;i<n;i++){const k=addDays(today(),-i-off);const d=S.days[k];if(d)s+=f(d,k)||0}return s}
function lineSVG(series,w=560,h=170,labels){const all=series.flatMap(s=>s.v);const mx=Math.max(10,...all);const n=series[0].v.length;const X=i=>20+i*(w-40)/(n-1),Y=v=>h-24-(v/mx)*(h-44);
  return`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;direction:ltr">${[0,.5,1].map(f=>`<line x1="20" x2="${w-20}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="#EEF2EF"/>`).join('')}
   ${series.map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${s.v.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>${s.v.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="#fff" stroke="${s.c}" stroke-width="2"><title>${v}</title></circle>`).join('')}`).join('')}
   ${labels.map((l,i)=>i%2===0||n<10?`<text x="${X(i)}" y="${h-6}" font-size="11" fill="#71818A" text-anchor="middle">${l}</text>`:'').join('')}</svg>`}

   <div class="row"><div class="f1"><label>اليوم</label><input type="date" id="etD" value="${x.due||''}"></div><div class="f1"><label>الساعة (اختياري — هيرن)</label><input type="time" id="etTm" value="${x.time||''}"></div><div class="f1"><label>المدة (د)</label><input type="number" id="etE" value="${x.est||30}"></div></div>
   <div class="row"><div class="f1"><label>تتكرر؟</label><select id="etR">${[['none','لأ'],['daily','كل يوم'],['weekdays','أيام الشغل'],['weekly','كل أسبوع'],['monthly','كل شهر']].map(([v,n])=>`<option value="${v}" ${(x.repeat||'none')===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="f1"><label>الحالة</label><select id="etS"><option value="todo" ${x.status==='todo'?'selected':''}>📥 هتتعمل</option><option value="doing" ${x.status==='doing'?'selected':''}>▶️ شغال</option><option value="done" ${x.status==='done'?'selected':''}>✓ خلصت</option></select></div></div>
   <label>خطوات صغيرة</label><div id="etSub">${x.sub.map((s,i)=>`<div class="row" style="margin-bottom:4px"><input type="checkbox" data-si="${i}" ${s.d?'checked':''}><span class="f1 small">${esc(s.t)}</span><button class="x" data-sx="${i}">✕</button></div>`).join('')}</div>
   <div class="row"><input type="text" id="etSubIn" placeholder="ضيف خطوة واضغط Enter"></div>
   <label>ملاحظات</label><textarea id="etN" rows="3">${esc(x.note||'')}</textarea>
   <div class="row wrap"><button class="btn" id="etOk">حفظ</button><button class="btn ghost" id="etRem">⏰ ذكّرني بيها</button><button class="btn ghost" id="etDup">نسخة</button><div class="f1"></div><button class="btn ghost" style="color:var(--rose)" id="etDel">مسح</button></div></div>`,()=>{
   const rs=()=>{$$('#etSub [data-si]').forEach(c=>c.onchange=()=>{x.sub[+c.dataset.si].d=c.checked;if(c.checked)addXP(3,x.cat);save()});$$('#etSub [data-sx]').forEach(c=>c.onclick=()=>{x.sub.splice(+c.dataset.sx,1);save();editTask(id)})};rs();
   $('#etSubIn').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){x.t=$('#etT').value;x.sub.push({t:e.target.value.trim(),d:false});save();editTask(id)}};
   $('#etOk').onclick=()=>{const was=x.status;Object.assign(x,{t:$('#etT').value.trim()||x.t,cat:$('#etC').value,prio:$('#etP').value,due:$('#etD').value||null,time:$('#etTm').value,est:+$('#etE').value||30,repeat:$('#etR').value,note:$('#etN').value});
     const ns=$('#etS').value;if(ns==='done'&&was!=='done'){toggleTask(id)}else if(ns!=='done'&&was==='done'){toggleTask(id);x.status=ns}else x.status=ns;save();closeModal();refresh()};
   $('#etRem').onclick=()=>{closeModal();remModal({t:x.t,task:x.id,at:x.due?new Date(x.due+'T'+(x.time||'10:00')).getTime():null})};

/* ================== NOTES ================== */
let nTag='all',nSearch='';
function addNote(body,extra={}){const n=Object.assign({id:uid('n'),body,title:'',color:NOTE_COLORS[0],pin:false,created:Date.now(),updated:Date.now()},extra);S.notes.unshift(n);S.stats.notes++;save();checkBadges();touch();return n}
const noteTags=n=>[...new Set((n.body.match(/#[\p{L}\p{N}_]+/gu)||[]).map(t=>t.slice(1)))];
const noteMents=n=>[...new Set((n.body.match(/@[\p{L}\p{N}_]+/gu)||[]).map(t=>t.slice(1)))];
function noteRender(b,id){return esc(b).split('\n').map((l,i)=>{const m=l.match(/^\s*-\s*\[( |x)\]\s?(.*)$/);let h=m?`<label class="chk ${m[1]==='x'?'on':''}"><input type="checkbox" data-nc="${id}|${i}" ${m[1]==='x'?'checked':''}><span>${m[2]}</span></label>`:l;
  return h.replace(/#([\p{L}\p{N}_]+)/gu,'<span class="tag">#$1</span>').replace(/@([\p{L}\p{N}_]+)/gu,'<span class="ment">@$1</span>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}).join('\n')}
R.notes=()=>{const tags={};S.notes.forEach(n=>noteTags(n).forEach(t=>tags[t]=(tags[t]||0)+1));
  $('#v-notes').innerHTML=`<div class="card" style="margin-bottom:14px"><div class="row wrap"><textarea id="nIn" rows="2" class="f1" placeholder="اكتب ملاحظة بسرعة… #تاج @اسم   (- [ ] لعمل checklist)" style="min-width:240px"></textarea>
   <div class="col"><button class="btn" id="nAdd">حفظ</button><button class="btn ghost sm" id="nMic">🎤</button></div></div>
   <div class="row wrap small muted" style="margin-top:8px">📋 قوالب: ${Object.keys(NOTE_TPL).map(k=>`<button class="chip" style="background:var(--bg);cursor:pointer" data-tpl="${k}">${k}</button>`).join(' ')}</div>
   <div class="muted small" style="margin-top:8px">⚡ اكتب من أي مكان: دوس <span class="kbd">N</span> أو زرار ＋ اللي تحت، أو <span class="kbd">Ctrl</span>+<span class="kbd">K</span> للبحث في كل حاجة.</div></div>
  <div class="row wrap" style="margin-bottom:12px"><div class="tabs" style="margin:0"><button class="tab ${nTag==='all'?'on':''}" data-tg="all">الكل (${S.notes.length})</button><button class="tab ${nTag==='pin'?'on':''}" data-tg="pin">📌 المثبتة</button><button class="tab ${nTag==='todo'?'on':''}" data-tg="todo">☑️ فيها مهام</button>${Object.entries(tags).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([t,c])=>`<button class="tab ${nTag===t?'on':''}" data-tg="${esc(t)}">#${esc(t)} ${c}</button>`).join('')}</div><div class="f1"></div><input type="search" id="nSearch" placeholder="🔍 دوّر في الملاحظات" style="width:220px" value="${esc(nSearch)}"></div>
  <div class="notes" id="nList"></div>`;
  $('#nAdd').onclick=()=>{const v=$('#nIn').value.trim();if(!v)return;addNote(v);$('#nIn').value='';renderNotes();toast('🗒️ اتحفظت')};
  $('#nIn').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))$('#nAdd').click()};
  $('#nMic').onclick=()=>dictate($('#nIn'));
  $$('[data-tpl]').forEach(b=>b.onclick=()=>{const n=addNote(NOTE_TPL[b.dataset.tpl],{title:b.dataset.tpl});editNote(n.id)});
  $$('#v-notes [data-tg]').forEach(b=>b.onclick=()=>{nTag=b.dataset.tg;R.notes()});
  $('#nSearch').oninput=e=>{nSearch=e.target.value;renderNotes()};renderNotes()};
function renderNotes(){let L=S.notes.slice();const q=nSearch.toLowerCase();
  if(nTag==='pin')L=L.filter(n=>n.pin);else if(nTag==='todo')L=L.filter(n=>/-\s*\[ \]/.test(n.body));else if(nTag!=='all')L=L.filter(n=>noteTags(n).includes(nTag));
  if(q)L=L.filter(n=>(n.title+' '+n.body).toLowerCase().includes(q));
  L.sort((a,b)=>(b.pin-a.pin)||(b.updated-a.updated));
  $('#nList').innerHTML=L.map(n=>`<div class="note" style="--nc:${n.color}" data-n="${n.id}"><h4>${n.pin?'📌':''}<span class="f1">${esc(n.title||'')}</span></h4><div class="bd">${noteRender(n.body,n.id)}</div>
   <div class="meta">${fmtDay(dkey(n.updated))} ${hm(n.updated)}${n.rem?` · ⏰ ${fmtWhen(n.rem)}`:''}</div></div>`).join('')||'<div class="card empty" style="column-span:all">لسه مفيش ملاحظات هنا ✍️</div>';
  $$('#nList .note').forEach(e=>e.onclick=ev=>{if(ev.target.closest('[data-nc]'))return;editNote(e.dataset.n)});
  $$('#nList [data-nc]').forEach(c=>c.onclick=ev=>{ev.stopPropagation();const[id,i]=c.dataset.nc.split('|');toggleNoteLine(id,+i);renderNotes()})}
function toggleNoteLine(id,i){const n=S.notes.find(x=>x.id===id);const L=n.body.split('\n');L[i]=L[i].replace(/\[( |x)\]/,m=>m==='[ ]'?'[x]':'[ ]');if(/\[x\]/.test(L[i]))addXP(3,'work');n.body=L.join('\n');n.updated=Date.now();save()}
function editNote(id){const n=S.notes.find(x=>x.id===id);if(!n)return;
  modal(`<div class="row" style="margin-bottom:10px"><input type="text" id="enT" placeholder="عنوان (اختياري)" value="${esc(n.title||'')}" style="font-weight:800;font-size:17px"><button class="ib" id="enPin" title="تثبيت" style="font-size:20px">${n.pin?'📌':'📍'}</button></div>
   <textarea id="enB" rows="12" style="font-size:15px">${esc(n.body)}</textarea>
   <div class="row wrap" style="margin-top:8px;gap:6px"><button class="btn ghost xs" id="enChk">☑️ checklist</button><button class="btn ghost xs" id="enMic">🎤 بصوتي</button><button class="btn ghost xs" id="enTime">🕐 الوقت</button><div class="f1"></div><div class="colors">${NOTE_COLORS.map(c=>`<button style="background:${c}" class="${n.color===c?'on':''}" data-c="${c}"></button>`).join('')}</div></div>
   ${noteMents(n).length?`<div class="small muted" style="margin-top:8px">👤 ${noteMents(n).map(m=>`<a href="#" data-pm="${esc(m)}">@${esc(m)}</a>`).join(' ')} — دوس عشان تضيفه للناس</div>`:''}
   <hr><div class="row wrap"><button class="btn" id="enOk">حفظ</button><button class="btn ghost sm" id="enTask">✅ حوّلها مهام</button><button class="btn ghost sm" id="enRem">⏰ ذكّرني</button><button class="btn ghost sm" id="enCopy">📋 نسخ</button><div class="f1"></div><button class="btn ghost sm" style="color:var(--rose)" id="enDel">مسح</button></div>
   <div class="muted small" style="margin-top:8px">آخر تعديل: ${fmtWhen(n.updated)}</div>`,()=>{
   let color=n.color,pin=n.pin;$$('.colors [data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;$$('.colors [data-c]').forEach(x=>x.classList.toggle('on',x===b))});
   $('#enPin').onclick=()=>{pin=!pin;$('#enPin').textContent=pin?'📌':'📍'};
   const ins=s=>{const ta=$('#enB'),p=ta.selectionStart;ta.value=ta.value.slice(0,p)+s+ta.value.slice(p);ta.focus();ta.selectionStart=ta.selectionEnd=p+s.length};
   $('#enChk').onclick=()=>ins('\n- [ ] ');$('#enTime').onclick=()=>ins(`[${fmtWhen(Date.now())}] `);$('#enMic').onclick=()=>dictate($('#enB'));
   const sv=()=>{n.title=$('#enT').value.trim();n.body=$('#enB').value;n.color=color;n.pin=pin;n.updated=Date.now();save()};
   $('#enOk').onclick=()=>{sv();closeModal();refresh()};
   $('#enB').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){sv();closeModal();refresh()}};
   $('#enTask').onclick=()=>{sv();const lines=n.body.split('\n').map(l=>l.match(/^\s*-\s*\[ \]\s?(.+)$/)).filter(Boolean).map(m=>m[1].trim()).filter(Boolean);const items=lines.length?lines:[n.title||n.body.split('\n')[0]];
     items.forEach(t=>{const p=parseWhen(t);S.tasks.push({id:uid('t'),t:p&&p.clean?p.clean:t,cat:'work',prio:'m',est:30,due:p?dkey(p.at):today(),time:'',status:'todo',sub:[],created:Date.now(),note:'من ملاحظة: '+(n.title||'')})});save();closeModal();toast(`✅ اتعمل ${items.length} مهمة`);refresh()};
   $('#enRem').onclick=()=>{sv();closeModal();const p=parseWhen(n.body);remModal({t:n.title||n.body.split('\n')[0].slice(0,80),at:p?p.at:null,note:n.id})};
   $('#enCopy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(($('#enT').value?$('#enT').value+'\n':'')+$('#enB').value);toast('📋 اتنسخت')};
   $('#enDel').onclick=()=>confirmBox('تمسح الملاحظة دي؟',()=>{S.notes=S.notes.filter(x=>x.id!==id);save();refresh()});
   $$('[data-pm]').forEach(a=>a.onclick=e=>{e.preventDefault();sv();const nm=a.dataset.pm.replace(/_/g,' ');if(!S.contacts.find(c=>c.name===nm)){S.contacts.push({id:uid('c'),name:nm,type:'agent',every:14,last:today(),notes:''});save();toast('🤝 اتضاف للناس')}else toast('موجود بالفعل')});
  },true)}

/* ================== REMINDERS ================== */
const REP={none:'مرة واحدة',hourly:'كل ساعة',daily:'كل يوم',weekdays:'أيام الشغل',weekly:'كل أسبوع',monthly:'كل شهر'};
function remModal(pre={}){const r=pre.id?S.reminders.find(x=>x.id===pre.id):null;const at=r?r.at:pre.at||Date.now()+36e5;const d=new Date(at);
  modal(`<h3>⏰ ${r?'تعديل':'تذكير جديد'}</h3><div class="formg">
   <label>فكّرني بـ…</label><input type="text" id="rmT" value="${esc(r?r.t:pre.t||'')}" placeholder="مثال: أكلم الجامعة بعد ساعة">
   <div id="rmP" class="parse hide"></div>
   <label>إمتى؟</label><div class="row wrap" style="gap:6px">${[['بعد 10 د',10],['بعد 30 د',30],['بعد ساعة',60],['بعد 3 ساعات',180]].map(([n,m])=>`<button class="btn ghost xs" data-q="${m}">${n}</button>`).join('')}<button class="btn ghost xs" data-qd="1">بكرة 9 الصبح</button><button class="btn ghost xs" data-qd="ev">النهارده 8 بالليل</button></div>
   <div class="row"><input type="date" id="rmD" value="${dkey(d)}"><input type="time" id="rmH" value="${hm(d)}"></div>
   <div class="row"><div class="f1"><label>يتكرر</label><select id="rmR">${Object.entries(REP).map(([k,v])=>`<option value="${k}" ${(r?r.repeat:'none')===k?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="f1"><label>الصوت</label><select id="rmS"><option value="">الافتراضي</option>${Object.entries(SOUNDS).map(([k,v])=>`<option value="${k}" ${r&&r.sound===k?'selected':''}>${v}</option>`).join('')}</select></div></div>
   <label>تفاصيل (اختياري)</label><input type="text" id="rmB" value="${esc(r?r.body||'':'')}">
   <div class="row"><button class="btn" id="rmOk">حفظ</button><button class="btn ghost sm" id="rmTest">🔊 جرّب الصوت</button>${r?`<div class="f1"></div><button class="btn ghost sm" style="color:var(--rose)" id="rmDel">مسح</button>`:''}</div></div>`,()=>{
   const setAt=ms=>{const x=new Date(ms);$('#rmD').value=dkey(x);$('#rmH').value=hm(x)};
   $$('[data-q]').forEach(b=>b.onclick=()=>setAt(Date.now()+b.dataset.q*6e4));
   $$('[data-qd]').forEach(b=>b.onclick=()=>setAt(new Date((b.dataset.qd==='1'?addDays(today(),1)+'T09:00':today()+'T20:00')).getTime()));
   $('#rmT').oninput=()=>{const p=parseWhen($('#rmT').value);const b=$('#rmP');b.classList.toggle('hide',!p);if(p){b.innerHTML=`🕐 فهمت: <b>${p.label}</b>`;setAt(p.at)}};
   $('#rmTest').onclick=()=>playSound($('#rmS').value||S.settings.sound);
   $('#rmOk').onclick=()=>{let t=$('#rmT').value.trim();if(!t)return;const p=parseWhen(t);if(p&&p.clean)t=p.clean;const ms=new Date($('#rmD').value+'T'+$('#rmH').value).getTime();if(!ms){toast('اختار الوقت');return}
     const o={t,at:ms,repeat:$('#rmR').value,sound:$('#rmS').value||null,body:$('#rmB').value,fired:false,done:false};
     if(r)Object.assign(r,o);else addReminder(t,ms,{...o,task:pre.task,note:pre.note});
     if(pre.note){const n=S.notes.find(x=>x.id===pre.note);if(n)n.rem=ms}
     save();closeModal();refresh();toast('⏰ هفكرك '+fmtWhen(ms)+(ms<Date.now()?' (الوقت ده فات!)':''));if(!audioOk)renderBanner()};
   const del=$('#rmDel');if(del)del.onclick=()=>{S.reminders=S.reminders.filter(x=>x.id!==r.id);save();closeModal();refresh()}})}
R.rem=()=>{const now=Date.now();const up=S.reminders.filter(r=>!r.done&&!r.fired).sort((a,b)=>a.at-b.at);const fired=S.reminders.filter(r=>!r.done&&r.fired);const done=S.reminders.filter(r=>r.done).sort((a,b)=>b.doneAt-a.doneAt).slice(0,30);
  const row=r=>`<div class="trow"><span style="font-size:20px">${r.repeat&&r.repeat!=='none'?'🔁':'⏰'}</span><span class="tt"><b>${esc(r.t)}</b>${r.body?`<div class="muted small">${esc(r.body)}</div>`:''}</span><span class="chip" style="background:var(--bg)">${fmtWhen(r.at)}</span><span class="muted small">${r.done?'':fmtRel(r.at)}</span>${r.repeat&&r.repeat!=='none'?`<span class="chip" style="background:var(--lav-soft);color:var(--lav)">${REP[r.repeat]}</span>`:''}
   ${r.done?'':`<button class="ib" data-rd="${r.id}" title="تم">✓</button><button class="ib" data-re="${r.id}" title="تعديل">✏️</button>`}<button class="x" data-rx="${r.id}">✕</button></div>`;
  const st=S.settings;
  $('#v-rem').innerHTML=`<div id="remBanner"></div>
   <div class="grid g2"><div class="grid" style="align-content:start">
    <div class="card"><div class="row wrap"><input type="text" id="rmQ" class="f1" placeholder="اكتب: «كلم أحمد بكرة 3 العصر» أو «اشرب دوا بعد ساعة»" style="min-width:220px"><button class="btn" id="rmQOk">⏰ ذكّرني</button><button class="btn ghost" id="rmAdv">⚙️ تفصيلي</button></div><div id="rmQP" class="parse hide"></div></div>
    ${fired.length?`<div class="card"><h3>🔔 رنّت ومستنية منك ✓</h3>${fired.map(row).join('')}</div>`:''}
    <div class="card"><h3>📅 الجاية <span class="r">${up.length}</span></h3>${up.map(row).join('')||'<div class="empty">مفيش تذكيرات — ضيف واحد فوق</div>'}</div>
    ${done.length?`<div class="card"><h3>✓ خلصت</h3>${done.map(row).join('')}</div>`:''}</div>
   <div class="grid" style="align-content:start">
    <div class="card"><h3>🔔 التنبيهات التلقائية <span class="r">السكرتير بيعملها لوحده</span></h3>
     ${[['prayAlertOn',`🕌 قبل كل صلاة بـ ${st.prayAlert} دقيقة`],['prayAtOn','🕌 مع الأذان'],['briefOn',`🌅 ملخص الصبح الساعة ${st.brief}`],['reviewOn',`🪞 مراجعة اليوم الساعة ${st.review}`],['nudge',`👀 لو قعدت ${st.nudgeMin/60} ساعة من غير إنجاز في الشغل`],['followups','🤝 متابعات الإيجنتس المتأخرة'],['blockAlerts','🗓️ مع بداية كل بلوك في الخطة'],['water','💧 اشرب مية كل ساعة ونص'],['eyes','👁️ ريّح عينك كل 50 دقيقة'],['friday','🕌 الجمعة: الكهف'],['fast','🌙 صيام الاتنين والخميس'],['weekly','🗓️ المراجعة الأسبوعية (الحد بالليل)']].map(([k,n])=>`<label class="row small" style="padding:6px 0;border-bottom:1px solid var(--line)"><input type="checkbox" data-st="${k}" ${st[k]?'checked':''}><span class="f1">${n}</span></label>`).join('')}
     <div class="muted small" style="margin-top:8px">غيّر المواعيد والصوت من ⚙️ الإعدادات.</div></div>
    <div class="card"><h3>📱 عشان يرن حتى والموقع مقفول</h3><p class="small muted" style="line-height:1.9">الموقع بيرن طول ما هو مفتوح في تاب (حتى في الخلفية). عشان الموبايل يرن حتى لو الموقع مقفول: نزّل التذكيرات كملف كالندر وافتحه على الموبايل، وهيضيفهم لتقويمك بالمنبه.</p><button class="btn sm" id="icsB" style="margin-top:8px">📅 صدّر التذكيرات للكالندر</button></div>
    <div class="card"><h3>🔊 الأصوات</h3><div class="row wrap" style="gap:6px">${Object.entries(SOUNDS).map(([k,v])=>`<button class="btn ghost sm" data-ps="${k}">${v}</button>`).join('')}</div><button class="btn coral sm" style="margin-top:10px" id="testAl">🚨 جرّب منبه كامل</button></div>

function boot(){
  load();applyTheme();buildNav();
  document.body.addEventListener('click',()=>{if(!audioOk){audioOk=true;ac()}},{once:true});
  renderTop();renderDate();renderBanner();renderIosHint();
  const h=location.hash.slice(1);go(h&&R[h]?h:'today');
  if(h==='quick'){go('today');setTimeout(()=>quickCapture('note'),300)}
  if(/[?&]mini=1/.test(location.search))document.body.classList.add('mini');
  loadPrayers();renderCounts();$('#sideQuote').textContent=pick(QUOTES);
  checkReminders(true);cloudInit();
  setInterval(()=>{checkReminders(false);renderCounts()},10000);
  setInterval(()=>{const np=nextPrayer();if(np&&$('#nextT')){let s=Math.max(0,Math.round((np.m-nowMin())*60));$('#nextT').textContent=`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;$('#nextLabel').textContent='باقي على '+np.a}
    if(today()!==curDay){curDay=today();WX=null;applyTheme();loadPrayers(true);refresh()}},1000);
  setInterval(()=>{if(curView==='today'){renderPrayers()}if(curView==='sec'&&$('.tl'))renderPlan()},60000);
  if(location.protocol.startsWith('http')&&'serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  // keep audio alive in background tabs & wake lock for focus
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminders(false);refresh()}});
}
let curDay=today();
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(),typing=tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}
  const K=e.key.toLowerCase(),C=e.ctrlKey||e.metaKey;
  if(C&&!e.shiftKey&&(K==='q'||K==='ض')){e.preventDefault();quickCapture('note');return}
  if(C&&e.shiftKey&&(K==='q'||K==='ض')){e.preventDefault();quickCapture('task');return}
  if(C&&e.altKey&&(K==='r'||K==='ق')){e.preventDefault();quickCapture('rem');return}
  if(e.altKey&&!C&&/^[1-9]$/.test(K)){e.preventDefault();const vs=VIEWS.filter(v=>v[0]!=='g');if(vs[+K-1])go(vs[+K-1][0]);return}
  if(!$('#modal').classList.contains('hide')&&$('.qc')&&C&&/^[123]$/.test(K)){e.preventDefault();const b=$$('.qc .modes button')[+K-1];b&&b.click();return}
  if(e.key==='Escape'){if(!$('#pal').classList.contains('hide'))closePalette();else if(!$('#modal').classList.contains('hide'))closeModal();return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey||!$('#modal').classList.contains('hide')||!$('#pal').classList.contains('hide')||!$('#alarm').classList.contains('hide'))return;
  const k=e.key.toLowerCase();const map={n:'note','ى':'note',t:'task','ف':'task',r:'rem','ق':'rem'};
  if(map[k]){e.preventDefault();quickCapture(map[k]);return}
  if(k==='f'||k==='ب'){e.preventDefault();go('focus');return}
  if(/^[1-9]$/.test(k)){const vs=VIEWS.filter(v=>v[0]!=='g');if(vs[+k-1])go(vs[+k-1][0])}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h==='quick')quickCapture('note');else if(R[h]&&h!==curView)go(h)});

function renderAcct(){const el=$('#acct');if(!el)return;
  if(!FB_CONFIG){el.innerHTML=`<p class="muted small" style="line-height:1.8">الموقع شغال <b>محلي</b> دلوقتي — البيانات على الجهاز ده بس. لما نربط حسابك (Firebase) هتدخل بإيميل وباسورد وبياناتك تبقى معاك من أي جهاز.</p>`;return}
  if(!fbUser){el.innerHTML=`<p class="muted small">مش مسجل دخول${navigator.onLine?'':' (مفيش نت)'}.</p><button class="btn sm" onclick="cloudInit()">دخول</button>`;return}
  el.innerHTML=`<div class="row"><span style="font-size:22px">👤</span><div class="f1"><b style="direction:ltr;display:block;text-align:right">${esc(fbUser.email)}</b><div class="muted small">${fbLast?'آخر مزامنة '+fmtWhen(fbLast):'متزامن'}</div></div></div>
   <div class="row wrap"><button class="btn sm" id="acSync">🔄 زامن دلوقتي</button><button class="btn ghost sm" id="acPw">🔑 غيّر الباسورد</button><button class="btn ghost sm" id="acOut" style="color:var(--rose)">خروج من الجهاز ده</button></div>
   <label>🗄️ نسخ احتياطية يومية على السيرفر</label><div id="acBk" class="muted small">…</div>`;
  $('#acSync').onclick=async()=>{await cloudPush();await cloudPull(false);renderAcct();toast('☁️ تمام')};
  $('#acPw').onclick=async()=>{try{await FB.auth.sendPasswordResetEmail(fbUser.email);toast('📧 بعتنالك رسالة تغيّر منها الباسورد')}catch(e){toast(authErr(e))}};
  $('#acOut').onclick=()=>confirmBox('تخرج من الجهاز ده؟ بياناتك هتفضل محفوظة على حسابك وهتتمسح من الجهاز ده بس.',cloudLogout);
  cloudBackups().then(ks=>{$('#acBk').innerHTML=ks.length?ks.slice(0,14).map(k=>`<div class="row" style="padding:4px 0"><span class="f1">${fmtDay(k)} (${k})</span><button class="btn ghost xs" data-bk="${k}">رجّع النسخة دي</button></div>`).join(''):'لسه مفيش';
    $$('[data-bk]').forEach(b=>b.onclick=()=>confirmBox('ترجّع نسخة '+b.dataset.bk+'؟ البيانات الحالية هتتبدل بيها.',()=>cloudRestore(b.dataset.bk)))}).catch(()=>{$('#acBk').textContent='مقدرتش أجيبها دلوقتي'})}

const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function renderIosHint(){const el=$('#iosHint');if(!el)return;if(!isIOS()||isStandalone()||localStorage.getItem('hayati_ioshint')==='x'){el.classList.add('hide');return}
  el.classList.remove('hide');el.innerHTML=`<span style="font-size:24px">📲</span><div class="f1 small" style="line-height:1.8"><b>نزّله كتطبيق على الآيفون:</b> افتح الرابط ده في <b>Safari</b> ← دوس زرار المشاركة <b>⬆️</b> تحت ← <b>Add to Home Screen</b> ← <b>Add</b>. وبعدها افتحه من الأيقونة.</div><button class="x" id="iosX">✕</button>`;
  $('#iosX').onclick=()=>{localStorage.setItem('hayati_ioshint','x');el.classList.add('hide')}}

boot();
</script>
